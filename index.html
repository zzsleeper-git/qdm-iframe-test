<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>QDM iframe Height Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      overflow-x: hidden;
      background: #111;
    }

    .info {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      font-size: 16px;
      text-align: center;
      line-height: 1.5;
    }

    .section {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #111;
      border-bottom: 1px solid rgba(0,0,0,.18);
    }

    .s1 { background: #f5f0e8; }
    .s2 { background: #e8dcc8; }
    .s3 { background: #d6b46a; }
    .s4 { background: #b7924d; }
    .s5 { background: #8f6f3a; color: white; }
    .s6 { background: #5a4530; color: white; }
    .s7 { background: #2c2825; color: white; }
    .s8 { background: #111111; color: white; }
    .s9 { background: #000000; color: white; }
  </style>
</head>

<body>
  <div class="info">
    QDM iframe 高度測試｜每一格 100px｜看到第幾格就代表 iframe 顯示到幾百 px
  </div>

  <div class="section s1">100px</div>
  <div class="section s2">200px</div>
  <div class="section s3">300px</div>
  <div class="section s4">400px</div>
  <div class="section s5">500px</div>
  <div class="section s6">600px</div>
  <div class="section s7">700px</div>
  <div class="section s8">800px</div>
  <div class="section s9">900px</div>
</body>
</html>
